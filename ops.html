<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SV Ops">
  <meta name="theme-color" content="#0B1623">
  <title>Smart Vision Ops</title>
  <style>
    :root {
      --bg:          #0B1623;
      --bg-surface:  #111E2E;
      --bg-card:     #162333;
      --bg-card2:    #1A2A3E;
      --accent:      #1E9AD6;
      --accent-dk:   #0E5F8A;
      --txt:         #E8EDF2;
      --text-muted:  #8899AA;
      --border:      rgba(30,154,214,0.22);
      --danger:      #C0392B;
      --warn:        #E67E22;
      --success:     #27AE60;
      --radius:      10px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--txt);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* ── GATE OVERLAY ── */
    #ops-gate {
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    #ops-gate.hidden { display: none; }
    #ops-gate .gate-logo {
      font-size: 32px; font-weight: 700;
      color: var(--accent);
      letter-spacing: -1px;
      margin-bottom: 4px;
    }
    #ops-gate h2 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
    #ops-gate p { font-size: 13px; color: var(--text-muted); margin: 0 0 20px; text-align: center; max-width: 300px; line-height: 1.5; }
    #ops-gate input {
      width: 100%; max-width: 280px;
      padding: 13px 15px; font-size: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--txt); font-family: inherit;
    }
    #ops-gate input:focus { outline: none; border-color: var(--accent); }
    #ops-gate button {
      margin-top: 10px; width: 100%; max-width: 280px;
      padding: 13px 20px; background: var(--accent); color: white;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    #ops-gate button:active { opacity: 0.85; }
    #ops-gate .err { color: var(--danger); font-size: 12px; margin-top: 8px; min-height: 16px; }
    #ops-app[hidden] { display: none; }

    /* ── HEADER ── */
    #header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    #header .logo {
      font-size: 16px; font-weight: 700;
      color: var(--accent); letter-spacing: -0.3px;
    }
    #header .logo span { color: var(--text-muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
    .voice-bar { display: flex; gap: 8px; align-items: center; }
    .voice-btn {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--txt); border-radius: 8px;
      padding: 7px 12px; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      font-family: inherit; transition: background 0.2s;
      white-space: nowrap;
    }
    .voice-btn:active { background: var(--bg-card2); }
    .voice-btn.active { background: var(--danger); border-color: var(--danger); }

    /* ── MAIN LAYOUT ── */
    main { padding: 14px 14px 80px; max-width: 760px; margin: 0 auto; }

    /* ── SECTION TITLES ── */
    .section-title {
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted);
      margin: 20px 0 10px;
    }
    .section-title:first-child { margin-top: 0; }

    /* ── FLAGS ── */
    .flag-card {
      background: var(--bg-card); border-radius: var(--radius);
      border-left: 3px solid var(--danger);
      padding: 12px 14px; margin-bottom: 8px;
    }
    .flag-card.warn { border-left-color: var(--warn); }
    .flag-title {
      font-size: 14px; font-weight: 600; margin-bottom: 3px;
      display: flex; align-items: flex-start; gap: 6px;
    }
    .flag-badge {
      font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; padding: 2px 6px; border-radius: 4px;
      background: rgba(192,57,43,0.2); color: var(--danger);
      flex-shrink: 0; margin-top: 1px;
    }
    .flag-badge.warn { background: rgba(230,126,34,0.2); color: var(--warn); }
    .flag-scope { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .flag-detail { font-size: 13px; color: #AAB9CC; line-height: 1.5; }

    /* ── PROJECT CARDS ── */
    .project-card {
      background: var(--bg-card); border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 13px 14px; margin-bottom: 8px;
      cursor: pointer; transition: border-color 0.2s;
    }
    .project-card:active { border-color: var(--accent); }
    .project-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .project-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .project-progress-label {
      font-size: 12px; font-weight: 600; color: var(--accent);
      flex-shrink: 0; margin-top: 1px;
    }
    .progress-bar-wrap {
      height: 4px; background: rgba(255,255,255,0.08);
      border-radius: 2px; margin: 8px 0 6px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--accent-dk), var(--accent));
      transition: width 0.6s ease;
    }
    .project-status { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .project-next {
      font-size: 12px; color: #9EB3C8;
      background: rgba(30,154,214,0.07);
      border-radius: 6px; padding: 7px 10px;
      line-height: 1.5;
    }
    .project-next::before { content: "→ "; color: var(--accent); font-weight: 600; }

    /* Task list inside expanded card */
    .task-list { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .task-item {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 12px; color: #9EB3C8; padding: 5px 8px;
      background: rgba(255,255,255,0.03); border-radius: 6px;
    }
    .task-checkbox {
      width: 16px; height: 16px; border-radius: 4px;
      border: 1.5px solid var(--border); background: transparent;
      cursor: pointer; flex-shrink: 0; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .task-checkbox.done { background: var(--accent); border-color: var(--accent); }
    .task-checkbox.done::after { content: "✓"; color: white; font-size: 10px; font-weight: 700; }
    .task-text { flex: 1; line-height: 1.45; }
    .task-text.done { text-decoration: line-through; color: var(--text-muted); }
    .task-priority {
      font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; padding: 1px 5px; border-radius: 3px;
      flex-shrink: 0;
    }
    .task-priority.critical { background: rgba(192,57,43,0.2); color: var(--danger); }
    .task-priority.high { background: rgba(230,126,34,0.15); color: var(--warn); }

    /* collapsed tasks hidden by default */
    .project-card .task-list { display: none; }
    .project-card.expanded .task-list { display: flex; }
    .expand-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

    /* ── DIVISION FILTER ── */
    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .filter-btn {
      font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; padding: 5px 10px; border-radius: 20px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-muted); cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

    /* ── PIPELINE CARDS ── */
    .pipeline-card {
      background: var(--bg-card); border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 13px 14px; margin-bottom: 8px;
    }
    .pipeline-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .pipeline-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .stage-badge {
      font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
      background: rgba(30,154,214,0.15); color: var(--accent);
      flex-shrink: 0; white-space: nowrap;
    }
    .stage-badge.stalled { background: rgba(192,57,43,0.15); color: var(--danger); }
    .stage-badge.proposal { background: rgba(230,126,34,0.15); color: var(--warn); }
    .pipeline-days {
      font-size: 11px; color: var(--text-muted); margin: 4px 0;
    }
    .pipeline-days .days-num { font-weight: 600; }
    .pipeline-days .days-num.stale { color: var(--warn); }
    .pipeline-days .days-num.critical-stale { color: var(--danger); }
    .pipeline-status { font-size: 12px; color: #9EB3C8; margin: 5px 0; line-height: 1.5; }
    .pipeline-next {
      font-size: 12px; color: #9EB3C8;
      background: rgba(30,154,214,0.07);
      border-radius: 6px; padding: 7px 10px; margin-top: 6px;
      line-height: 1.5;
    }
    .pipeline-next::before { content: "→ "; color: var(--accent); font-weight: 600; }
    .pipeline-contact { font-size: 11px; color: var(--text-muted); margin-top: 5px; }

    /* ── BLOCKER LIST ── */
    .blocker-item {
      background: var(--bg-card); border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 12px 14px; margin-bottom: 8px;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .blocker-num {
      font-size: 20px; font-weight: 700; color: var(--accent);
      line-height: 1; flex-shrink: 0; min-width: 24px;
    }
    .blocker-text { font-size: 13px; color: #9EB3C8; line-height: 1.55; }

    /* ── VOICE STATUS ── */
    #voice-status {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg-surface); border-top: 1px solid var(--border);
      padding: 10px 16px; font-size: 12px; color: var(--text-muted);
      min-height: 38px; display: none; align-items: center; gap: 8px;
    }
    #voice-status.visible { display: flex; }
    #voice-status .pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--danger); animation: pulse 1s ease-in-out infinite; flex-shrink: 0;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

    /* ── MISC ── */
    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .empty { font-size: 13px; color: var(--text-muted); padding: 12px; text-align: center; }

    @media (min-width: 600px) {
      main { padding: 20px 20px 80px; }
      .project-name { font-size: 15px; }
    }
  </style>
</head>

<!-- ════════════════════════════════════════════
     PASSCODE GATE
════════════════════════════════════════════ -->
<div id="ops-gate">
  <div class="gate-logo">SV</div>
  <h2>Smart Vision Operations</h2>
  <p>Enter passcode to continue. This device will be remembered after first unlock.</p>
  <input id="ops-passcode" type="password" autocomplete="current-password" placeholder="Passcode" />
  <button id="ops-unlock-btn">Unlock</button>
  <div class="err" id="ops-err"></div>
</div>

<!-- ════════════════════════════════════════════
     MAIN APP
════════════════════════════════════════════ -->
<div id="ops-app" hidden>

  <!-- HEADER -->
  <div id="header">
    <div class="logo">SV Ops <span id="header-date"></span></div>
    <div class="voice-bar">
      <button class="voice-btn" id="btn-speak" title="Read daily briefing aloud">🔊 Brief</button>
      <button class="voice-btn" id="btn-listen" title="Voice input">🎤</button>
    </div>
  </div>

  <main>

    <!-- ── FLAGS ── -->
    <div class="section-title">🚨 Critical flags</div>
    <div id="flags-critical"></div>

    <div class="section-title" style="margin-top:14px">⚠️ Warnings</div>
    <div id="flags-warn"></div>

    <div class="divider"></div>

    <!-- ── PROJECTS ── -->
    <div class="section-title">Projects</div>
    <div class="filter-bar" id="project-filters"></div>
    <div id="projects-list"></div>

    <div class="divider"></div>

    <!-- ── PIPELINE ── -->
    <div class="section-title">Pipeline — IoT</div>
    <div id="pipeline-iot"></div>

    <div class="section-title" style="margin-top:14px">Pipeline — Consulting</div>
    <div id="pipeline-consult"></div>

    <div class="divider"></div>

    <!-- ── TRANSITION BLOCKERS ── -->
    <div class="section-title">Full-time transition blockers</div>
    <div id="blockers-list"></div>

    <div style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:16px">
      State audited <span id="audit-date"></span> · v<span id="state-version"></span>
    </div>

  </main>

  <!-- VOICE STATUS BAR -->
  <div id="voice-status">
    <span class="pulse"></span>
    <span id="voice-text">Listening…</span>
  </div>

</div><!-- /ops-app -->

<script>
/* ════════════════════════════════════════════
   PASSCODE GATE
════════════════════════════════════════════ */
(function () {
  const PASSCODE = "iotpulse2026"; // CHANGE THIS before sharing the URL
  const KEY = "sv-ops-unlocked-v1";
  const gate = document.getElementById("ops-gate");
  const app  = document.getElementById("ops-app");
  const input = document.getElementById("ops-passcode");
  const err   = document.getElementById("ops-err");

  function unlock() {
    gate.classList.add("hidden");
    app.hidden = false;
  }

  if (localStorage.getItem(KEY) === "yes") { unlock(); }

  function tryUnlock() {
    if (input.value === PASSCODE) {
      localStorage.setItem(KEY, "yes");
      unlock();
    } else {
      err.textContent = "Wrong passcode.";
      input.value = "";
      input.focus();
    }
  }

  document.getElementById("ops-unlock-btn").addEventListener("click", tryUnlock);
  input.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
  input.focus();
})();
</script>

/* ════════════════════════════════════════════
   RENDER
════════════════════════════════════════════ */

// ── Date header ──
(function () {
  const d = new Date();
  const opts = { weekday: "short", month: "short", day: "numeric" };
  document.getElementById("header-date").textContent =
    d.toLocaleDateString("en-ZA", opts);
  document.getElementById("audit-date").textContent = STATE.meta.lastAudited;
  document.getElementById("state-version").textContent = STATE.meta.version;
})();

// ── Flags ──
(function () {
  const crit = document.getElementById("flags-critical");
  const warn = document.getElementById("flags-warn");
  STATE.flags.forEach(f => {
    const el = document.createElement("div");
    el.className = "flag-card" + (f.level === "warn" ? " warn" : "");
    el.innerHTML = `
      <div class="flag-title">
        <span class="flag-badge${f.level === "warn" ? " warn" : ""}">${f.level}</span>
        ${esc(f.title)}
      </div>
      <div class="flag-scope">${esc(f.scope)}</div>
      <div class="flag-detail">${esc(f.detail)}</div>`;
    (f.level === "critical" ? crit : warn).appendChild(el);
  });
})();

// ── Division filter ──
const DIVISIONS = [
  { id: "all", label: "All" },
  { id: "iot", label: "IoT" },
  { id: "ceo", label: "CEO" },
  { id: "website", label: "Website" },
  { id: "shw", label: "SHW" },
  { id: "consulting", label: "Consulting" },
  { id: "dayjob", label: "Day Job" },
  { id: "solar", label: "Solar" },
  { id: "personal", label: "Personal" },
];

let activeDiv = "all";

function renderProjects() {
  const list = document.getElementById("projects-list");
  list.innerHTML = "";
  STATE.projects
    .filter(p => activeDiv === "all" || p.division === activeDiv)
    .forEach(p => {
      const card = document.createElement("div");
      card.className = "project-card";
      card.dataset.id = p.id;

      const taskHtml = p.tasks ? p.tasks.map(t => `
        <div class="task-item">
          <div class="task-checkbox${t.state === "done" ? " done" : ""}" data-task="${t.id}" data-proj="${p.id}"></div>
          <span class="task-text${t.state === "done" ? " done" : ""}">${esc(t.title)}${t.note ? ` <em style="color:var(--text-muted)">(${esc(t.note)})</em>` : ""}</span>
          ${t.priority ? `<span class="task-priority ${t.priority}">${t.priority}</span>` : ""}
        </div>`).join("") : "";

      card.innerHTML = `
        <div class="project-header">
          <div class="project-name">${p.statusEmoji} ${esc(p.name)}</div>
          <div class="project-progress-label">${p.progress}%</div>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" style="width:${p.progress}%"></div>
        </div>
        <div class="project-status">${esc(p.status)}</div>
        <div class="project-next">${esc(p.nextAction)}</div>
        ${taskHtml ? `<div class="task-list">${taskHtml}</div><div class="expand-hint">Tap to toggle tasks</div>` : ""}`;

      card.addEventListener("click", e => {
        // Don't collapse if clicking a checkbox
        if (e.target.classList.contains("task-checkbox")) return;
        card.classList.toggle("expanded");
      });

      list.appendChild(card);
    });

  // Wire task checkboxes
  list.querySelectorAll(".task-checkbox").forEach(cb => {
    cb.addEventListener("click", e => {
      e.stopPropagation();
      cb.classList.toggle("done");
      cb.nextElementSibling.classList.toggle("done");
      // Persist in localStorage
      const key = `task-${cb.dataset.proj}-${cb.dataset.task}`;
      localStorage.setItem(key, cb.classList.contains("done") ? "done" : "todo");
    });
    // Restore from localStorage
    const key = `task-${cb.dataset.proj}-${cb.dataset.task}`;
    if (localStorage.getItem(key) === "done") {
      cb.classList.add("done");
      cb.nextElementSibling.classList.add("done");
    }
  });
}

(function initFilters() {
  const bar = document.getElementById("project-filters");
  DIVISIONS.forEach(d => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (d.id === "all" ? " active" : "");
    btn.textContent = d.label;
    btn.addEventListener("click", () => {
      bar.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeDiv = d.id;
      renderProjects();
    });
    bar.appendChild(btn);
  });
  renderProjects();
})();

// ── Pipeline ──
(function () {
  function renderPipeline(divId, containerId) {
    const el = document.getElementById(containerId);
    STATE.pipeline.filter(p => p.division === divId).forEach(p => {
      const daysClass = p.daysSince >= 45 ? "critical-stale" : p.daysSince >= 20 ? "stale" : "";

        <div class="pipeline-card">
          <div class="pipeline-header">
            <div class="pipeline-name">${esc(p.name)}</div>
            <span class="stage-badge ${p.stageClass || ""}">${esc(p.stageLabel)}</span>
          </div>
          <div class="pipeline-days">Last touch: <span class="days-num ${daysClass}">${p.daysSince}d ago</span></div>
          <div class="pipeline-status">${esc(p.status)}</div>
          <div class="pipeline-next">${esc(p.nextAction)}</div>
          ${p.contact ? `<div class="pipeline-contact">👤 ${esc(p.contact)}</div>` : ""}
        </div>`;
    });
  }
  renderPipeline("iot", "pipeline-iot");
  renderPipeline("consulting", "pipeline-consult");
})();

// ── Blockers ──
(function () {
  const el = document.getElementById("blockers-list");
  STATE.transitionBlockers.forEach((b, i) => {
    el.innerHTML += `
      <div class="blocker-item">
        <div class="blocker-num">${i + 1}</div>
        <div class="blocker-text">${esc(b)}</div>
      </div>`;
  });
})();

/* ════════════════════════════════════════════
   VOICE — READ ALOUD
════════════════════════════════════════════ */
(function () {
  const btn = document.getElementById("btn-speak");
  let speaking = false;

  function buildBriefing() {
    const lines = [];
    const d = new Date();
    lines.push(`Smart Vision Operations briefing, ${d.toDateString()}.`);

    const critical = STATE.flags.filter(f => f.level === "critical");
    if (critical.length) {
      lines.push(`${critical.length} critical flag${critical.length > 1 ? "s" : ""}.`);
      critical.forEach(f => lines.push(`${f.scope}: ${f.title}. ${f.detail}`));
    }

    const warns = STATE.flags.filter(f => f.level === "warn");
    if (warns.length) {
      lines.push(`${warns.length} warning${warns.length > 1 ? "s" : ""}.`);
      warns.forEach(f => lines.push(`${f.scope}: ${f.title}`));
    }

    lines.push("Top next actions.");
    STATE.projects
      .filter(p => p.tasks && p.tasks.some(t => t.priority === "critical" || t.priority === "high"))
      .slice(0, 4)
      .forEach(p => {
        const t = p.tasks.find(t => t.priority === "critical" || t.priority === "high");
        lines.push(`${p.name}: ${t.title}.`);
      });

    lines.push("Transition blockers: " + STATE.transitionBlockers.slice(0, 3).join(". ") + ".");
    lines.push("End of briefing.");

    return lines.join(" ");
  }

  btn.addEventListener("click", () => {
    if (speaking) {
      window.speechSynthesis.cancel();
      speaking = false;
      btn.textContent = "🔊 Brief";
      return;
    }
    const text = buildBriefing();
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = 0.95;
    utt.lang = "en-ZA";
    utt.onstart = () => { speaking = true; btn.textContent = "⏹ Stop"; };
    utt.onend = () => { speaking = false; btn.textContent = "🔊 Brief"; };
    utt.onerror = () => { speaking = false; btn.textContent = "🔊 Brief"; };
    window.speechSynthesis.speak(utt);
  });
})();

/* ════════════════════════════════════════════
   VOICE — LISTEN INPUT
════════════════════════════════════════════ */
(function () {
  const btn = document.getElementById("btn-listen");
  const statusBar = document.getElementById("voice-status");
  const voiceText = document.getElementById("voice-text");

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    btn.title = "Speech recognition not supported on this browser";
    btn.style.opacity = "0.4";
    btn.style.cursor = "default";
    return;
  }

  const rec = new SpeechRecognition();
  rec.lang = "en-ZA";
  rec.continuous = false;
  rec.interimResults = true;

  let listening = false;

  btn.addEventListener("click", () => {
    if (listening) {
      rec.stop();
      return;
    }
    rec.start();
  });

  rec.onstart = () => {
    listening = true;
    btn.classList.add("active");
    statusBar.classList.add("visible");
    voiceText.textContent = "Listening…";
  };

  rec.onresult = e => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join("");
    voiceText.textContent = transcript;
  };

  rec.onend = () => {
    listening = false;
    btn.classList.remove("active");
    statusBar.classList.remove("visible");
  };

  rec.onerror = e => {
    listening = false;
    btn.classList.remove("active");
    statusBar.classList.remove("visible");
    if (e.error !== "aborted") voiceText.textContent = "Error: " + e.error;
  };
})();

/* ════════════════════════════════════════════
   UTILS
════════════════════════════════════════════ */
function esc(str) {
  if (!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
